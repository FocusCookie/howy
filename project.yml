name: Howy
options:
  bundleIdPrefix: lueddemann
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    DEVELOPMENT_TEAM: GQ9M79TF33
    CODE_SIGN_STYLE: Automatic
    # Lets automatic signing register group.howy on the App IDs.
    REGISTER_APP_GROUPS: YES
    CODE_SIGN_IDENTITY: "Apple Development"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "2.5.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    # The store file in the App Group, read by HowyCore (`HowyStoreFileName` in both targets'
    # Info.plist). Both mirror to CloudKit's Development environment, but each is wiped on its
    # own, so they must never share a file. Release keeps the user's real `Howy.store`.
    Debug:
      HOWY_STORE_FILE_NAME: Howy-Debug.store
    Release:
      HOWY_STORE_FILE_NAME: Howy.store
packages:
  HowyCore:
    path: Packages/HowyCore
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.4.0
targets:
  Howy:
    type: application
    attributes:
      # Lets automatic signing turn on App Groups for the App ID, so the
      # provisioning profile grants group.howy.
      SystemCapabilities:
        com.apple.ApplicationGroups.Mac:
          enabled: 1
        # iCloud (CloudKit + key-value store) and push, for the store's CloudKit mirroring.
        # The app only: the widget extension never mirrors (see docs/plans/icloud-sync.md).
        com.apple.iCloud:
          enabled: 1
        com.apple.Push:
          enabled: 1
    platform: macOS
    sources:
      - path: Howy
    dependencies:
      - package: HowyCore
      - package: KeyboardShortcuts
      - target: HowyWidgets
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lueddemann.howy
        PRODUCT_NAME: Howy
        INFOPLIST_FILE: Howy/Info.plist
        ENABLE_APP_SANDBOX: YES
        GENERATE_INFOPLIST_FILE: NO
        # Both configurations use CloudKit's Development environment (one entitlements file).
        CODE_SIGN_ENTITLEMENTS: Howy/Howy.entitlements
    info:
      path: Howy/Info.plist
      properties:
        CFBundleDisplayName: Howy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only Apple's own TLS/CloudKit encryption, so App Store uploads skip
        # the export-compliance question.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        HowyStoreFileName: $(HOWY_STORE_FILE_NAME)
        CFBundleURLTypes:
          - CFBundleURLName: lueddemann.howy
            CFBundleURLSchemes: [howy]
        # The drag type of an attachment thumbnail (`AttachmentDrag`): the id, for dropping it on
        # the note as a chip.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: lueddemann.howy.attachment-id
            UTTypeDescription: Howy attachment id
            UTTypeConformsTo: [public.data]
  HowyWidgets:
    type: app-extension
    attributes:
      # Lets automatic signing turn on App Groups for the App ID, so the
      # provisioning profile grants group.howy.
      SystemCapabilities:
        com.apple.ApplicationGroups.Mac:
          enabled: 1
    platform: macOS
    sources:
      - path: HowyWidgets
    dependencies:
      - package: HowyCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lueddemann.howy.widgets
        PRODUCT_NAME: HowyWidgets
        INFOPLIST_FILE: HowyWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: HowyWidgets/HowyWidgets.entitlements
        ENABLE_APP_SANDBOX: YES
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    info:
      path: HowyWidgets/Info.plist
      properties:
        CFBundleDisplayName: Howy Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        HowyStoreFileName: $(HOWY_STORE_FILE_NAME)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: HowyWidgets/HowyWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.howy
schemes:
  Howy:
    build:
      targets:
        Howy: all
        HowyWidgets: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
