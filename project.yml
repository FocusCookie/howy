name: Howy
options:
  bundleIdPrefix: io.lichtwart
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    DEVELOPMENT_TEAM: GQ9M79TF33
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "1.6.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  HowyCore:
    path: Packages/HowyCore
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.4.0
targets:
  Howy:
    type: application
    platform: macOS
    sources:
      - path: Howy
    dependencies:
      - package: HowyCore
      - package: KeyboardShortcuts
      - target: HowyWidgets
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.lichtwart.howy
        PRODUCT_NAME: Howy
        INFOPLIST_FILE: Howy/Info.plist
        CODE_SIGN_ENTITLEMENTS: Howy/Howy.entitlements
        ENABLE_APP_SANDBOX: YES
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Howy/Info.plist
      properties:
        CFBundleDisplayName: Howy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        HowyAppGroup: $(TeamIdentifierPrefix)io.lichtwart.howy
        CFBundleURLTypes:
          - CFBundleURLName: io.lichtwart.howy
            CFBundleURLSchemes: [howy]
    entitlements:
      path: Howy/Howy.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        # Fetches a pasted link's page title (the note's link dialog).
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)io.lichtwart.howy
  HowyWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: HowyWidgets
    dependencies:
      - package: HowyCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.lichtwart.howy.widgets
        PRODUCT_NAME: HowyWidgets
        INFOPLIST_FILE: HowyWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: HowyWidgets/HowyWidgets.entitlements
        ENABLE_APP_SANDBOX: YES
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    info:
      path: HowyWidgets/Info.plist
      properties:
        CFBundleDisplayName: Howy Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        HowyAppGroup: $(TeamIdentifierPrefix)io.lichtwart.howy
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: HowyWidgets/HowyWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)io.lichtwart.howy
schemes:
  Howy:
    build:
      targets:
        Howy: all
        HowyWidgets: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
